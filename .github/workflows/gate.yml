name: gate

# The card claims a tier that is supposed to be EARNED. That claim is only worth something if
# somebody who is not the author can re-run the check on hardware the author does not own.
on: [push, pull_request, workflow_dispatch]

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚑ PINNED. An unpinned checker can change its rules between the run that passed and the run
      # you are citing.
      - name: Fetch witness @v0.2
        run: git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git .witness

      - name: Tests must pass before anything is mutated
        run: node card.test.mjs

      - name: Mutation gate
        run: node .witness/witness.mjs mutate card.mjs --cap 400 --baseline witness.card.baseline.json --test "node card.test.mjs" | tee gate.out

      - name: Refuse anything short of clean
        run: |
          node -e "
            const out = require('fs').readFileSync('gate.out','utf8');
            const m = /\"clean\":\s*(true|false)/.exec(out);
            if (!m) { console.error('the gate produced no verdict at all'); process.exit(1); }
            if (m[1] !== 'true') { console.error('mutants survived — those lines are test-theatre'); process.exit(1); }
            console.log('gate clean');
          "

      # THE VISIBLE SEAL (CARD-SPEC §7.1) — sealmark.mjs draws the band on every card and reads it back off a
      # stripped one. Gated by its own pinned witness; nothing baselined.
      - name: Fetch witness @v0.6
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness6

      - name: The visible seal — tests, then the mutation gate
        run: |
          node --test sealmark.test.mjs
          node .witness6/witness.mjs mutate sealmark.mjs --timeout 60000 --cap 400 --test node --test sealmark.test.mjs | tee sealmark.out
          grep -q '"clean": true' sealmark.out || { echo "::error::mutants survived in sealmark.mjs"; exit 1; }

      - name: The survival run's seal is exactly what its script writes
        run: node scripts/survive.mjs --check

      # ⚑ THE PAGE MUST CARRY THE KERNEL THAT WAS JUST GATED, or the gate is green about a file the
      # Forge does not use — the most comfortable kind of lie. (The builder moved to scripts/ and this step
      # kept calling the old path, so the gate stood red from 2026-09-16 until the visible-seal change.)
      - name: The shipped page must match the gated kernel
        run: |
          node scripts/build-page.mjs
          git diff --exit-code index.html README.md || (echo "index.html or README.md is stale — run node scripts/build-page.mjs and commit it" && exit 1)
