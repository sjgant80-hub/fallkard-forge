name: gate

# The card claims a tier that is supposed to be EARNED. That claim is only worth something if
# somebody who is not the author can re-run the check on hardware the author does not own.
on: [push, pull_request, workflow_dispatch]

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the U→V seal is checked against the commit that sealed it
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚑ PINNED. An unpinned checker can change its rules between the run that passed and the run
      # you are citing.
      - name: Fetch witness @v0.2
        run: git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git .witness

      - name: Tests must pass before anything is mutated
        run: node card.test.mjs

      - name: Mutation gate
        run: node .witness/witness.mjs mutate card.mjs --cap 400 --baseline witness.card.baseline.json --test "node card.test.mjs" | tee gate.out

      - name: Refuse anything short of clean
        run: |
          node -e "
            const out = require('fs').readFileSync('gate.out','utf8');
            const m = /\"clean\":\s*(true|false)/.exec(out);
            if (!m) { console.error('the gate produced no verdict at all'); process.exit(1); }
            if (m[1] !== 'true') { console.error('mutants survived — those lines are test-theatre'); process.exit(1); }
            console.log('gate clean');
          "

      # THE VISIBLE SEAL (CARD-SPEC §7.1) — sealmark.mjs draws the band on every card and reads it back off a
      # stripped one. Gated by its own pinned witness; nothing baselined.
      - name: Fetch witness @v0.6
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness6

      - name: The visible seal — tests, then the mutation gate
        run: |
          node --test sealmark.test.mjs
          node .witness6/witness.mjs mutate sealmark.mjs --timeout 60000 --cap 400 --test node --test sealmark.test.mjs | tee sealmark.out
          grep -q '"clean": true' sealmark.out || { echo "::error::mutants survived in sealmark.mjs"; exit 1; }

      - name: The survival run's seal is exactly what its script writes
        run: node scripts/survive.mjs --check

      # THE PAID READ — vision.mjs grades a vision model's reads of the printed seal. Gated like sealmark.
      - name: The paid read's grader — tests, then the mutation gate
        run: |
          node --test vision.test.mjs
          node .witness6/witness.mjs mutate vision.mjs --timeout 60000 --cap 400 --test node --test vision.test.mjs | tee vision.out
          grep -q '"clean": true' vision.out || { echo "::error::mutants survived in vision.mjs"; exit 1; }

      - name: The paid read's seal is exactly what its script writes from the committed cards
        run: node scripts/vision.mjs --check

      # THE TRADE (MESH step 2) — trade.mjs decides what a device may show of a card another device sent it, and
      # proves who sent it. Gated like sealmark; nothing baselined.
      - name: The trade kernel — tests, then the mutation gate
        run: |
          node --test trade.test.mjs
          node .witness6/witness.mjs mutate trade.mjs --timeout 60000 --cap 400 --test node --test trade.test.mjs | tee trade.out
          grep -q '"clean": true' trade.out || { echo "::error::mutants survived in trade.mjs"; exit 1; }

      # THE FIRST THING THE GAME SHIPPED — read rule 0.2 (U reads as V), sealed before it was measured. Once measured,
      # the measurement re-runs here on every push and must come out identical.
      - name: The U→V change — its seal, then its measurement re-run
        run: |
          node scripts/uv-ship.mjs --check
          if [ -f data/uv-run.json ]; then node scripts/uv-ship.mjs --verify; fi

      - name: The basis — no untraced price, and this repository's own current compliance map
        run: |
          git clone --quiet https://github.com/sjgant80-hub/fallstack /tmp/fallstack && git -C /tmp/fallstack checkout --quiet 4eeb828
          git clone --quiet https://github.com/sjgant80-hub/fall-euaiact /tmp/fall-euaiact && git -C /tmp/fall-euaiact checkout --quiet d522314
          node /tmp/fallstack/tools/price-check.mjs .
          node /tmp/fall-euaiact/tools/comply-build.mjs . --check

      # ⚑ THE PAGE MUST CARRY THE KERNEL THAT WAS JUST GATED, or the gate is green about a file the
      # Forge does not use — the most comfortable kind of lie. (The builder moved to scripts/ and this step
      # kept calling the old path, so the gate stood red from 2026-09-16 until the visible-seal change.)
      - name: The shipped page must match the gated kernel
        run: |
          node scripts/build-page.mjs
          git diff --exit-code index.html README.md reader.html || (echo "index.html, README.md or reader.html is stale — run node scripts/build-page.mjs and commit it" && exit 1)

  # EVERY ORGAN, GATED ON THIS RUNNER. Each kernel the page, the standalone reader or the command line runs is
  # mutation-tested here with the pinned witness v0.6, against the test files that exercise it. A survivor is a line
  # no test checks, and it turns this push red. Exemptions live beside the code with a written reason:
  # witness.card.baseline.json for card.mjs, and witness.baseline.json (auto-detected beside the source) for the rest.
  kernels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kernel: reader-core.mjs, tests: reader.test.mjs }
          - { kernel: forgecase.mjs, tests: forgecase.test.mjs }
          - { kernel: card.mjs, tests: card.test.mjs, baseline: witness.card.baseline.json }
          - { kernel: forge.mjs, tests: test.mjs card.test.mjs forge-estate.test.mjs forge.green.test.mjs reader.test.mjs }
          - { kernel: art.mjs, tests: test.mjs forge-estate.test.mjs art-band.test.mjs }
          - { kernel: png.mjs, tests: test.mjs forge-estate.test.mjs art-band.test.mjs }
          - { kernel: lineage.mjs, tests: test.mjs forge-estate.test.mjs }
          - { kernel: fold.mjs, tests: fold.test.mjs }
          - { kernel: studio.mjs, tests: studio-suite.test.mjs reader.test.mjs }
          - { kernel: artifact.mjs, tests: studio-suite.test.mjs page-safety.test.mjs }
          - { kernel: babykcc.mjs, tests: studio-suite.test.mjs }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch witness @v0.6
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness6
      - name: ${{ matrix.kernel }} — its tests pass, then every mutant must be killed
        run: |
          node --test ${{ matrix.tests }}
          node .witness6/witness.mjs mutate ${{ matrix.kernel }} --timeout 180000 --cap 400 ${{ matrix.baseline && format('--baseline {0}', matrix.baseline) || '' }} --test node --test ${{ matrix.tests }} | tee gate.out
          grep -q '"clean": true' gate.out || { echo "::error::mutants survived in ${{ matrix.kernel }}"; exit 1; }
